---
anchors:
  # Databricks Unity Catalog configuration for test/prod - OAuth with service principal
  - &databricks_config
    type: databricks
    host:
      "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__SERVER_HOSTNAME') }}"
    http_path:
      "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__HTTP_PATH') }}"
    catalog:
      "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__CATALOG', 'workspace')
      }}"
    schema: "{{ env_var('DBT_SCHEMA', 'reporting') }}"
    threads: 4
  # BigQuery configuration retained for rollback path
  - &bigquery_config
    type: bigquery
    method: service-account
    project: "{{ env_var('GCP_PROJECT_ID') }}"
    keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
  # MotherDuck configuration (dbt-duckdb adapter, md: connection string).
  # Database from DESTINATION__MOTHERDUCK__CREDENTIALS__DATABASE (default
  # personal-muse), token from MOTHERDUCK_TOKEN; both are required for the
  # -md targets to connect.
  - &motherduck_config
    type: duckdb
    path: "md:{{ env_var('DESTINATION__MOTHERDUCK__CREDENTIALS__DATABASE', 'personal-muse') }}"
    motherduck_token: "{{ env_var('MOTHERDUCK_TOKEN') }}"
    schema: "{{ env_var('DBT_SCHEMA', 'reporting') }}"
    threads: 4
personal:
  target: "{{ env_var('DBT_TARGET', 'dev-db') }}"
  outputs:
    mock:
      type: duckdb
      path: dbt.duckdb
      schema: "{{ env_var('DBT_SCHEMA', 'reporting_dev') }}"
      # Session timezone is pinned to UTC globally via mise.toml [env]
      # (TZ=UTC); profile `settings` do not apply session-scoped
      # settings like TimeZone under dbt 2.x.
    # Primary targets - Databricks Unity Catalog
    dev-db:
      # Use the same token-based connection settings as the dlt destination.
      <<: *databricks_config
      token:
        "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__ACCESS_TOKEN') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'reporting_dev') }}"
    test-db:
      <<: *databricks_config
      client_id:
        "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__CLIENT_ID') }}"
      client_secret:
        "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__CLIENT_SECRET') }}"
      auth_type: oauth
      schema: "{{ env_var('DBT_SCHEMA', 'reporting_test') }}"
    prod-db:
      <<: *databricks_config
      client_id:
        "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__CLIENT_ID') }}"
      client_secret:
        "{{ env_var('DESTINATION__DATABRICKS__CREDENTIALS__CLIENT_SECRET') }}"
      auth_type: oauth
      schema: "{{ env_var('DBT_SCHEMA', 'reporting') }}"
    # Rollback targets - BigQuery (retained for easy rollback path)
    dev-bq:
      <<: *bigquery_config
      dataset: "{{ env_var('DBT_SCHEMA', 'reporting_dev') }}"
      threads: 4
    test-bq:
      <<: *bigquery_config
      dataset: "{{ env_var('DBT_SCHEMA', 'reporting_test') }}"
      threads: 4
    prod-bq:
      <<: *bigquery_config
      dataset: "{{ env_var('DBT_SCHEMA', 'reporting') }}"
      threads: 4
    # MotherDuck targets - primary path after the #145 migration
    dev-md:
      <<: *motherduck_config
      schema: "{{ env_var('DBT_SCHEMA', 'reporting_dev') }}"
    test-md:
      <<: *motherduck_config
      schema: "{{ env_var('DBT_SCHEMA', 'reporting_test') }}"
    prod-md:
      <<: *motherduck_config
      schema: "{{ env_var('DBT_SCHEMA', 'reporting') }}"
