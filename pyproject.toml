[project]
name = "personal-reporting-pipelines"
version = "1.0.0"
description = "Personal data integration and analytics platform tracking personal disciplines/habits"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dlt[bigquery,parquet,duckdb,databricks]",
    "google-cloud-bigquery-storage",
    "google-cloud-secret-manager",
    "google-api-python-client",
    "oauth2client<4",
    "psutil",
    "dbt~=2.0",
    "google-api-core>=2.15.0",
    "google-cloud-dataproc~=5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-dotenv",
    "pytest-mock",
    "prek",
    "ruff",
    "types-PyYAML",
    "types-requests",
    "responses",
    "faker",
    "marimo",
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "sphinx-autoapi",
    "dbt-bouncer",
    "yamlfix>=1.19.1",
    "python-semantic-release>=10.7.0,<11",
]

[tool.uv]
# dlt[databricks] pulls in databricks-sql-connector, which pins
# `oauthlib>=3.1.0,<4.0.0`. Adopting oauthlib 4.x (as dependency automation
# proposes) would force dropping the Databricks stack, the primary target, so
# hold it below 4.0.0 to keep the lockfile resolvable.
constraint-dependencies = ["oauthlib<4.0.0"]

[tool.semantic_release]
# Semantic versioning is derived from Conventional Commit messages. The next
# version is stamped into the Python project and the dbt project so release
# artifacts always agree with the generated tag.
version_toml = ["pyproject.toml:project.version"]
version_variables = ["dbt/dbt_project.yml:version"]
allow_zero_version = false
tag_format = "v{version}"
commit_parser = "conventional"
# Release commits must also be valid Conventional Commits.
commit_message = "chore(release): {version}"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
# Do not run repository hooks on the automated release commit.
no_git_verify = true

[tool.semantic_release.branches.main]
match = "(main)"
prerelease = false

[tool.semantic_release.commit_parser_options]
# Same types the commit check enforces. `revert` is a valid Conventional
# Commit type but is not in the parser default, so it is added explicitly.
allowed_tags = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]

[tool.semantic_release.changelog]
# Regenerate the changelog from the complete tag history on every release so
# checked-in entries can never drift or duplicate.
mode = "init"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
mask_initial_release = false

[tool.ruff]
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "dbt/dbt_packages",
    "docs",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*.py" = ["EXE002"]
"scripts/**/*.py" = ["BLE001", "S110"]
"tests/**/*.py" = ["BLE001", "S110"]

[tool.pytest.ini_options]
markers = [
    "e2e: marks tests as end-to-end tests",
    "live: marks tests that call external APIs and require explicit opt-in",
    "local: marks executable offline",
]
# Disable responses plugin by default to prevent interference with e2e tests
addopts = "-s -p no:pytest-responses --log-cli-level=INFO"
log_cli = true
log_cli_level = "INFO"
# Test discovery patterns
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["pipelines"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/virtualenvs/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol.*\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# dlt config dicts are not well-typed; suppress errors in pipeline source files
module = ["pipelines.hubspot", "pipelines.google_health", "pipelines.notion"]
ignore_errors = true

[[tool.mypy.overrides]]
# Sphinx-generated config file; not worth annotating
module = ["docs.source.conf"]
ignore_errors = true

[tool.bandit]
# B101 (assert) and B608 (SQL) are expected patterns in pytest test files
exclude_dirs = ["tests"]
skips = ["B105", "B106", "B608"]

[tool.yamlfix]
sequence_style = "block_style"
