name: test dbt transformations
on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbt/**/*.sql'
      - 'dbt/**/*.yml'
      - 'dbt/**/*.csv'
      - 'mise.toml'
      - 'scripts/databricks_warehouse.py'
      - 'scripts/validate_target.py'
      - 'pipelines/targets.py'
      - 'tests/unit/dbt/test_source_external_location.py'

permissions:
  contents: 'read'

concurrency:
  group: test-transforms-dev-md
  cancel-in-progress: false

jobs:
  test_dbt:
    # Dev credentials come from the `development` environment's secrets;
    # prod credentials are never available to this job (issue #174).
    environment: development
    runs-on: ubuntu-latest
    env:
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
      MISE_ENABLE_TOOLS: uv,python
      # Skip the semantic-manifest validation notice (no dbt_cloud.yml in this project)
      DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: '1'
    steps:
      - name: check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: set up mise and project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: install dependencies
        run: mise run setup

      - name: install dbt dependencies
        run: mise run dbt-deps

      - name: run local build (mock target with CSV fixtures)
        run: mise run dbt-build-mock

      - name: run local build with steps in gap detection (mock target)
        run: mise run dbt-build-mock-steps

      - name: run dbt source manifest test
        run: uv run pytest tests/unit/dbt/test_source_external_location.py -q

      - name: install 1Password CLI
        if: |
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
          github.event.pull_request.head.repo.fork == false
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4
        with:
          version: latest

      # Uses the shared dev-md database; the concurrency group serializes runs
      # because this job writes reporting_dev. Credentialed: runs only for
      # non-fork PRs from a repo/org owner, collaborator or member
      # (issue #174); external PRs get the mock builds above without
      # credentials.
      - name: run MotherDuck integration build (dev-md)
        if: |
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
          github.event.pull_request.head.repo.fork == false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          DBT_TARGET: dev-md
          DBT_SCHEMA: reporting_dev
          RAW_SCHEMA: raw_dev
        run: op run --environment "$OP_ENVIRONMENT_ID" -- env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" mise run dbt-build
