name: Lint and Code Quality

on:
  pull_request:
    branches:
      - main
  # All branches, not just main: lint is quick and catches issues
  # before a PR is opened (issue #174).
  push:

permissions:
  contents: read

jobs:
  lint:
    # A push to a PR branch fires both `push` and `pull_request`, which
    # would run this job twice. The push run already covers same-repo
    # PRs, so skip the pull_request run unless the PR is from a fork —
    # fork pushes never trigger workflows here (issue #174).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: uv,python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and project tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install dependencies
        run: mise run setup

      - name: Run prek checks
        run: mise run lint

      - name: Install dbt dependencies
        run: mise run dbt-deps

      - name: Run SQL linting
        run: mise run dbt-lint

      - name: Generate dbt artifacts
        run: |
          mise run dbt-parse-mock
          mise run dbt-compile-mock

      - name: Run dbt-bouncer checks
        uses: godatadriven/dbt-bouncer@1c45e86dee870952f36c67371c9a5c0ac4139444 # v3.8
        with:
          config-file: dbt/dbt-bouncer.yml
