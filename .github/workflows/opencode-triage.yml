name: opencode-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    # Only issues from a repo/org owner, collaborator or member are
    # triaged — the agent gets OPENCODE_API_KEY, so external issue text
    # must not trigger it (issue #174).
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    # A stuck agent must not burn the default 6h runner limit.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@2410593023d2c61f05123c9b0faf189a28dfbeee # pinned revision
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "edit": "deny",
                "glob": "allow",
                "grep": "allow",
                "list": "allow",
                "bash": "deny",
                "task": "deny",
                "external_directory": "deny",
                "todowrite": "deny",
                "webfetch": "deny",
                "websearch": "deny",
                "lsp": "deny",
                "skill": "deny",
                "question": "deny",
                "doom_loop": "deny"
              }
            }
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          prompt: |
            Review this issue. If there's a clear fix or relevant docs:
            - Provide documentation links
            - Add error handling guidance for code examples
            Otherwise, do not comment.
