name: run dbt transformations
on:
  schedule:
    - cron: '0 6 * * 1' # monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      target:
        description: 'Warehouse target'
        required: true
        default: 'prod-md'
        type: choice
        options:
          - prod-md
          - prod-db
      confirm_prod:
        description: 'Required for a prod-* full refresh: type the target name to confirm'
        required: false
        default: ''
        type: string
      force_full_refresh:
        description: 'Force full refresh'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-pipeline:
    # Environment selection (issue #174): only scheduled runs use the
    # ungated `production-scheduled` environment. Every other trigger
    # (manual dispatch, or any future trigger) uses the gated
    # `production` environment, so an unexpected trigger can never
    # silently get prod credentials without approval. Scheduled runs
    # always execute from `main`, so a workflow modified on a branch
    # cannot be scheduled. `production-scheduled` should still be
    # branch-restricted to `main`. The OP_SERVICE_ACCOUNT_TOKEN secret
    # and OP_ENVIRONMENT_ID variable live in the environments, not at
    # repo level, so jobs that don't reference one of these
    # environments cannot read them.
    environment: ${{ github.event_name == 'schedule' && 'production-scheduled' || 'production' }}
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: uv,python,databricks-cli
      # Skip the semantic-manifest validation notice (no dbt_cloud.yml in this project)
      DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: '1'
    steps:
      - name: checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: set up mise and project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: install project dependencies
        run: mise run setup

      - name: set target schemas
        run: uv run python scripts/target_schemas.py "${{ inputs.target || 'prod-md' }}" >> "$GITHUB_ENV"

      - name: install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4
        with:
          version: latest

      - name: install dbt dependencies
        run: mise run dbt-deps

      - name: check dbt source freshness
        continue-on-error: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
        run: |
          op run --environment "$OP_ENVIRONMENT_ID" -- env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" mise run dbt-source-freshness

      - name: run dbt build
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          FORCE_FULL_REFRESH: ${{ inputs.force_full_refresh }}
          CONFIRM_PROD: ${{ inputs.confirm_prod }}
        run: |
          if [ "$FORCE_FULL_REFRESH" = "true" ] && [ "$DBT_TARGET" != "${DBT_TARGET#prod-}" ]; then
            if [ "$CONFIRM_PROD" != "$DBT_TARGET" ]; then
              echo "Refusing production full refresh: set confirm_prod to '$DBT_TARGET'." >&2
              exit 1
            fi
          fi
          if [ "$FORCE_FULL_REFRESH" = "true" ]; then
            op run --environment "$OP_ENVIRONMENT_ID" -- env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" mise run dbt-build -- --full-refresh
          else
            op run --environment "$OP_ENVIRONMENT_ID" -- env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" mise run dbt-build
          fi
