name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Only the repository owner may trigger the agent. Comments, PR
    # descriptions and repo content can contain prompt-injection
    # instructions, so an untrusted commenter must not be able to run an
    # agent with credentials and write permissions (issue #174).
    if: |
      github.actor == 'michaelconan' &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@2410593023d2c61f05123c9b0faf189a28dfbeee # pinned revision
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "edit": "allow",
                "glob": "allow",
                "grep": "allow",
                "list": "allow",
                "bash": "allow",
                "task": "allow",
                "external_directory": {
                  "*": "deny",
                  "/tmp": "allow",
                  "/tmp/**": "allow",
                  "${{ github.workspace }}": "allow",
                  "${{ github.workspace }}/**": "allow"
                },
                "todowrite": "allow",
                "webfetch": "allow",
                "websearch": "allow",
                "lsp": "allow",
                "skill": "allow",
                "question": "deny",
                "doom_loop": "deny"
              }
            }
        with:
          model: ${{ vars.OPENCODE_MODEL }}
