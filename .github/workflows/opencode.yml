name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Only a repo/org owner, collaborator or member may trigger the
    # agent. Comments, PR descriptions and repo content can contain
    # prompt-injection instructions, so an untrusted commenter must not
    # be able to run an agent with credentials and write permissions
    # (issue #174). For review comments, the PR must also not be a fork:
    # a trusted member commenting /oc on an external PR would otherwise
    # run the agent with that PR's content in its prompt. The same
    # applies to /oc in a conversation comment (issue_comment): the
    # issue or PR's author must also be trusted — a member commenting
    # on an outsider's issue or an external PR would otherwise run the
    # agent on untrusted text (issue #174). The command must lead the
    # comment: a bare `contains` match also fires on prose that merely
    # mentions "/oc" — the bot's own review text did exactly that and
    # re-triggered this workflow in a loop.
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/oc') ||
      startsWith(github.event.comment.body, '/opencode')) &&
      (github.event_name != 'pull_request_review_comment' || github.event.pull_request.head.repo.fork == false) &&
      (github.event_name != 'issue_comment' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    # A stuck agent must not burn the default 6h runner limit.
    timeout-minutes: 60
    permissions:
      id-token: write
      # The agent is expected to land changes (edit/bash are allowed),
      # so its token needs write access; branch protection still
      # governs what it can push to.
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@2410593023d2c61f05123c9b0faf189a28dfbeee # pinned revision
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "edit": "allow",
                "glob": "allow",
                "grep": "allow",
                "list": "allow",
                "bash": "allow",
                "task": "allow",
                "external_directory": {
                  "*": "deny",
                  "/tmp": "allow",
                  "/tmp/**": "allow",
                  "${{ github.workspace }}": "allow",
                  "${{ github.workspace }}/**": "allow"
                },
                "todowrite": "allow",
                "webfetch": "allow",
                "websearch": "allow",
                "lsp": "allow",
                "skill": "allow",
                "question": "deny",
                "doom_loop": "deny"
              }
            }
        with:
          model: ${{ vars.OPENCODE_MODEL }}
