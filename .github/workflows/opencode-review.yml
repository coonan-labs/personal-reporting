name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Review PRs from any repo/org owner, collaborator or member —
    # just no externals. The review passes OPENCODE_API_KEY to the
    # agent, so external PRs must not trigger it (issue #174).
    # Agent tools are read-only (see the config below). Draft PRs are
    # skipped; marking one ready triggers a review via ready_for_review.
    # Concurrency cancels a stale review when a new push arrives.
    # Fork PRs are skipped too: GitHub withholds secrets on fork
    # pull_request runs, so the job would fail on an empty API key
    # instead of skipping cleanly.
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.draft == false
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # A stuck agent must not burn the default 6h runner limit.
    timeout-minutes: 30
    permissions:
      # The opencode action fetches an OIDC token at startup; without
      # this it fails before reviewing (issue #174).
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@2410593023d2c61f05123c9b0faf189a28dfbeee # pinned revision
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "permission": {
                "edit": "deny",
                "glob": "allow",
                "grep": "allow",
                "list": "allow",
                "bash": "deny",
                "task": "deny",
                "external_directory": "deny",
                "todowrite": "deny",
                "webfetch": "deny",
                "websearch": "deny",
                "lsp": "deny",
                "skill": "deny",
                "question": "deny",
                "doom_loop": "deny"
              }
            }
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
