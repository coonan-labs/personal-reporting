name: manual-load-transform

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to load into and build against (Databricks or MotherDuck; BigQuery excluded)'
        required: true
        default: 'dev-md'
        type: choice
        options:
          - dev-md
          - test-md
          - prod-md
          - dev-db
          - test-db
          - prod-db

permissions:
  contents: read

jobs:
  load-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISE_ENABLE_TOOLS: uv,python,databricks-cli
      DBT_TARGET: ${{ inputs.target }}
      RUNTIME__LOG_LEVEL: 'INFO'
      PYTHONUNBUFFERED: '1'
      DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: '1'
      TZ: UTC
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set up mise and project tools
        uses: jdx/mise-action@v4

      - name: install project dependencies
        run: uv sync

      - name: install 1Password CLI
        uses: 1password/install-cli-action@v4
        with:
          version: latest

      # Map the chosen target to its schemas. This mirrors TARGET_SCHEMAS in
      # pipelines/targets.py; the validate step rejects a mismatch if the two
      # ever drift apart.
      - name: set target schemas
        run: |
          case "$DBT_TARGET" in
            dev-md|dev-db) DBT_SCHEMA=reporting_dev; RAW_SCHEMA=raw_dev ;;
            test-md|test-db) DBT_SCHEMA=reporting_test; RAW_SCHEMA=raw_test ;;
            prod-md|prod-db) DBT_SCHEMA=reporting; RAW_SCHEMA=raw ;;
            *) echo "Unsupported target: $DBT_TARGET (BigQuery targets are excluded)" >&2; exit 1 ;;
          esac
          {
            echo "DBT_SCHEMA=$DBT_SCHEMA"
            echo "RAW_SCHEMA=$RAW_SCHEMA"
          } >> "$GITHUB_ENV"

      - name: validate target
        run: uv run python scripts/validate_target.py

      - name: start databricks warehouse
        if: endsWith(inputs.target, '-db')
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
        run: op run --environment "$OP_ENVIRONMENT_ID" -- uv run python scripts/databricks_warehouse.py

      - name: run notion pipeline (${{ inputs.target }})
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
        run: |
          op run --environment "$OP_ENVIRONMENT_ID" -- \
            env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" \
            uv run python -m pipelines.run_pipeline notion --full

      - name: run hubspot pipeline (${{ inputs.target }})
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
        run: |
          op run --environment "$OP_ENVIRONMENT_ID" -- \
            env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" \
            uv run python -m pipelines.run_pipeline hubspot --full

      - name: run google health pipeline (${{ inputs.target }})
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
        run: |
          op run --environment "$OP_ENVIRONMENT_ID" -- \
            env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" \
            uv run python -m pipelines.run_pipeline google_health --full

      - name: build dbt models (${{ inputs.target }})
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
        run: |
          op run --environment "$OP_ENVIRONMENT_ID" -- \
            env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" \
            uv run dbt build --project-dir dbt --profiles-dir dbt --target "$DBT_TARGET"

      # dlt state is uploaded for debugging only and is never restored: this
      # workflow always does a full refresh, which does not need prior state.
      # Incremental runs would need the state restored before the load.
      - name: upload dlt state files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-load-transform-pipeline-state
          path: |
            ~/.dlt/**/state.json
          if-no-files-found: ignore
          retention-days: 7
