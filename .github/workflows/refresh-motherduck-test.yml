name: test motherduck load
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'MotherDuck target to load into and build against'
        required: true
        default: 'dev-md'
        type: choice
        options:
          - dev-md
          - test-md
          - prod-md

permissions:
  contents: read

jobs:
  run-pipelines:
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: uv,python
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set up mise and project tools
        uses: jdx/mise-action@v4

      - name: install project dependencies
        run: mise run setup

      - name: install 1Password CLI
        uses: 1password/install-cli-action@v4
        with:
          version: latest

      # Map the chosen target to its schemas. This mirrors TARGET_SCHEMAS in
      # pipelines/targets.py; validate-target (run by the -md mise tasks)
      # rejects a mismatch if the two ever drift apart.
      - name: set target schemas
        run: |
          case "${{ inputs.target }}" in
            dev-md) DBT_SCHEMA=reporting_dev; RAW_SCHEMA=raw_dev ;;
            test-md) DBT_SCHEMA=reporting_test; RAW_SCHEMA=raw_test ;;
            prod-md) DBT_SCHEMA=reporting; RAW_SCHEMA=raw ;;
          esac
          echo "DBT_SCHEMA=$DBT_SCHEMA" >> "$GITHUB_ENV"
          echo "RAW_SCHEMA=$RAW_SCHEMA" >> "$GITHUB_ENV"

      - name: run notion pipeline (${{ inputs.target }})
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          DBT_TARGET: ${{ inputs.target }}
          DBT_SCHEMA: ${{ env.DBT_SCHEMA }}
          RAW_SCHEMA: ${{ env.RAW_SCHEMA }}
          RUNTIME__LOG_LEVEL: 'INFO'
          PYTHONUNBUFFERED: '1'
        run: |
          op run --environment "$OP_ENVIRONMENT_ID" -- env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" mise run pipeline-md -- notion --full

      - name: run hubspot pipeline (${{ inputs.target }})
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          DBT_TARGET: ${{ inputs.target }}
          DBT_SCHEMA: ${{ env.DBT_SCHEMA }}
          RAW_SCHEMA: ${{ env.RAW_SCHEMA }}
          RUNTIME__LOG_LEVEL: 'INFO'
          PYTHONUNBUFFERED: '1'
        run: |
          op run --environment "$OP_ENVIRONMENT_ID" -- env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" mise run pipeline-md -- hubspot --full

      - name: run google health pipeline (${{ inputs.target }})
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          DBT_TARGET: ${{ inputs.target }}
          DBT_SCHEMA: ${{ env.DBT_SCHEMA }}
          RAW_SCHEMA: ${{ env.RAW_SCHEMA }}
          RUNTIME__LOG_LEVEL: 'INFO'
          PYTHONUNBUFFERED: '1'
        run: |
          op run --environment "$OP_ENVIRONMENT_ID" -- env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" mise run pipeline-md -- google_health --full

      - name: build dbt models (${{ inputs.target }})
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          DBT_TARGET: ${{ inputs.target }}
          DBT_SCHEMA: ${{ env.DBT_SCHEMA }}
          RAW_SCHEMA: ${{ env.RAW_SCHEMA }}
          RUNTIME__LOG_LEVEL: 'INFO'
          PYTHONUNBUFFERED: '1'
        run: |
          op run --environment "$OP_ENVIRONMENT_ID" -- env DBT_TARGET="$DBT_TARGET" DBT_SCHEMA="$DBT_SCHEMA" RAW_SCHEMA="$RAW_SCHEMA" mise run dbt-build-md

      # dlt state is uploaded for debugging only and is never restored: this
      # workflow always does a full refresh, which does not need prior state.
      # Incremental runs would need the state restored before the load.
      - name: upload dlt state files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: motherduck-test-pipeline-state
          path: |
            ~/.dlt/**/state.json
          retention-days: 7
