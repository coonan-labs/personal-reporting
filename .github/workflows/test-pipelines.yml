name: test dlt pipelines

on:
  pull_request:
    branches:
      - main
    paths:
      - 'pipelines/**'
      - 'tests/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'mise.toml'
      - 'scripts/**'

permissions:
  contents: read

# Credentialed steps (1Password, live integration/E2E tests) run only for
# PRs from a repo/org owner, collaborator or member — just no externals. PR-controlled code executes in these jobs,
# so `github.actor != 'dependabot[bot]'` is not a trust boundary (issue
# #174). Fork PRs still get the offline unit tests and mock builds.
jobs:
  test-pipelines:
    # Dev credentials come from the `development` environment's secrets;
    # prod credentials are never available to this job (issue #174).
    environment: development
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: uv,python,databricks-cli
    steps:
      - name: checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: set up mise and project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: install project dependencies
        run: mise run setup

      - name: install 1Password CLI
        if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4
        with:
          version: latest

      - name: run local tests
        id: run_local_tests
        env:
          RUNTIME__LOG_LEVEL: 'INFO'
        run: mise run test

      - name: run integration tests
        id: run_int_tests
        if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          RUNTIME__LOG_LEVEL: 'INFO'
        run: op run --environment "$OP_ENVIRONMENT_ID" -- mise run test-live

      - name: run e2e tests
        id: run_e2e_tests
        if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          RUNTIME__LOG_LEVEL: 'INFO'
        run: op run --environment "$OP_ENVIRONMENT_ID" -- mise run test-e2e

      - name: check if tests ran
        id: check_tests
        if: always()
        run: |
          if [ "${{ steps.run_local_tests.outcome }}" != "skipped" ] || [ "${{ steps.run_int_tests.outcome }}" != "skipped" ] || [ "${{ steps.run_e2e_tests.outcome }}" != "skipped" ]; then
            echo "tests_ran=true" >> $GITHUB_OUTPUT
          else
            echo "tests_ran=false" >> $GITHUB_OUTPUT
          fi

      - name: upload coverage reports to Codecov
        if: steps.check_tests.outputs.tests_ran == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: upload test results to Codecov
        if: steps.check_tests.outputs.tests_ran == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results-local.xml,./test-results-e2e.xml
          report_type: test_results
