updates:
- directory: /
  package-ecosystem: devcontainers
  schedule:
    interval: weekly
  commit-message:
    prefix: "chore(deps)"
- directory: /
  ignore:
  - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  package-ecosystem: github-actions
  schedule:
    interval: weekly
  commit-message:
    prefix: "chore(deps)"
version: 2
